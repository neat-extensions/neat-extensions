# Daily canary: loads the extension into Chromium, visits live YouTube pages and
# checks every rule. When YouTube changes its markup this fails and opens an issue
# naming the broken rule ids, so rules.json can be fixed and redeployed
# (rules updates reach users without a store review).
name: canary

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  push:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system deps (cached browser)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Lint + unit tests
        run: npm run lint && npm run test:unit

      - name: End-to-end tests (live YouTube)
        id: e2e
        run: npm run test:e2e
        env:
          CI: "1"

      - name: Upload screenshots (one per page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-screenshots
          path: |
            test-results/screenshots/
            test-results/artifacts/**/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-report
          path: |
            test-results/results.json
            test-results/canary-summary.json
            test-results/perf.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Open issue on failure
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let s = { site: 'youtube', failedRules: [], failedTests: [] };
            try { s = JSON.parse(fs.readFileSync('test-results/canary-summary.json', 'utf8')); } catch {}
            const ids = s.failedRules.length ? s.failedRules.join(' ') : 'unknown';
            const title = `CANARY BROKEN: ${s.site} ${ids}`;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const tests = s.failedTests.map(t =>
              `### ${t.title}\nRules: ${t.rules.join(', ') || '—'}\n\n\`\`\`\n${t.error}\n\`\`\`\nScreenshots: ${t.screenshots.map(p => '`' + p.split(/[\\/]/).slice(-2).join('/') + '`').join(', ') || 'none'}`
            ).join('\n\n');
            const body = `The daily canary failed on **${s.site}**.\n\n**Failing rule ids:** ${ids}\n\nRun: ${run}\nScreenshots (one per page, plus failure shots) are in the **canary-screenshots** artifact of that run.\n\n${tests}`;
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', per_page: 100 });
            const existing = open.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: `Still failing: ${run}` });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['canary'] });
            }
