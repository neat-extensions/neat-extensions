# Daily canary: loads the extension into Chromium, visits live YouTube pages and
# checks every rule. When YouTube changes its markup this fails and opens an issue
# naming the broken rule ids, so rules.json can be fixed and redeployed
# (rules updates reach users without a store review).
name: canary

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  push:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: canary-${{ github.event_name }}-${{ github.ref }}
  # a new push supersedes an old push run; scheduled runs are never cancelled
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system deps (cached browser)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Lint + unit tests
        id: unit
        run: npm run lint && npm run test:unit

      # Deployed rules (repository variables RULES_URL / RULES_PUBLIC_KEY, set once
      # the rules host exists): fetch + signature + schema, then e2e runs against them.
      - name: Check deployed rules file
        id: remote
        if: vars.RULES_URL != ''
        run: node scripts/check-remote-rules.mjs youtube
        env:
          RULES_URL: ${{ vars.RULES_URL }}
          RULES_PUBLIC_KEY: ${{ vars.RULES_PUBLIC_KEY }}

      - name: End-to-end tests (live YouTube)
        id: e2e
        run: npm run test:e2e
        env:
          CI: "1"
          E2E_RULES_URL: ${{ vars.RULES_URL }}
          E2E_RULES_PUBLIC_KEY: ${{ vars.RULES_PUBLIC_KEY }}

      - name: Upload screenshots (one per page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-screenshots
          path: |
            test-results/screenshots/
            test-results/artifacts/**/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-report
          path: |
            test-results/results.json
            test-results/canary-summary.json
            test-results/perf.json
          if-no-files-found: ignore
          retention-days: 14

      # Only the daily run and main open issues; a broken feature branch must not.
      - name: Open or update issue on failure
        if: failure() && (github.event_name == 'schedule' || github.ref == 'refs/heads/main')
        uses: actions/github-script@v7
        env:
          UNIT: ${{ steps.unit.outcome }}
          REMOTE: ${{ steps.remote.outcome }}
          E2E: ${{ steps.e2e.outcome }}
        with:
          script: |
            const fs = require('fs');
            let s = { site: 'youtube', failedRules: [], failedTests: [] };
            if (process.env.E2E === 'failure') { try { s = JSON.parse(fs.readFileSync('test-results/canary-summary.json', 'utf8')); } catch {} }
            const extra = [];
            if (process.env.UNIT === 'failure') extra.push('lint-or-unit');
            if (process.env.REMOTE === 'failure') extra.push('remote-rules');
            const all = [...extra, ...s.failedRules];
            const ids = all.length ? all.join(' ') : 'setup';
            const title = `CANARY BROKEN: ${s.site} ${ids}`;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const tests = s.failedTests.map(t =>
              `### ${t.title}\nRules: ${t.rules.join(', ') || '—'}\n\n\`\`\`\n${t.error}\n\`\`\`\nScreenshots: ${t.screenshots.map(p => '`' + p.split(/[\\/]/).slice(-2).join('/') + '`').join(', ') || 'none'}`
            ).join('\n\n');
            const body = `The daily canary failed on **${s.site}**.\n\n**Failing rule ids:** ${ids}\n\nRun: ${run}\nScreenshots (one per page, plus failure shots) are in the **canary-screenshots** artifact of that run.\n\n${tests}`;
            // One open issue per site: later failures comment on it (and update the rule ids in its title).
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'canary', per_page: 100 });
            const existing = open.data.find(i => i.title.startsWith(`CANARY BROKEN: ${s.site}`));
            if (existing) {
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, title });
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['canary'] });
              // Two runs failing at once (push + schedule/manual) can both create one: keep the oldest.
              const again = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'canary', per_page: 100 });
              const mine = again.data.filter(i => i.title.startsWith(`CANARY BROKEN: ${s.site}`)).sort((a, b) => a.number - b.number);
              for (const dup of mine.slice(1)) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: dup.number, body: `Duplicate of #${mine[0].number}.` });
                await github.rest.issues.update({ ...context.repo, issue_number: dup.number, state: 'closed', state_reason: 'not_planned' });
              }
            }
