<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 14px sans-serif; }
  section { display: block; width: 400px; min-height: 40px; margin: 4px; }
  section.zero { min-height: 0; height: 0; padding: 0; margin: 0; }
  .hidden-by-site { display: none; }
  .invisible { visibility: hidden; }
  .transparent { opacity: 0; }
</style>
</head>
<body>
  <div id="feed">
    <section class="shelf" id="shorts-shelf"><h2 class="title">Shorts</h2><a href="/shorts/aaaaaaaaaaa">a short</a></section>
    <section class="shelf" id="video-shelf"><h2 class="title">Videos</h2><a href="/watch?v=bbbbbbbbbbb">a video</a></section>
    <section class="placeholder zero" id="empty-placeholder"></section>
    <div class="hidden-by-site"><section class="site-hidden" id="site-hidden">already hidden by the site</section></div>
    <section class="ghost invisible" id="invisible">visibility hidden</section>
    <section class="ghost transparent" id="transparent">opacity 0</section>
    <div class="contents-box" id="contents-box" style="display: contents"><section>child of display:contents</section></div>
    <ul id="grid">
      <li class="item"><a href="/watch?v=ccccccccccc">video</a></li>
      <li class="item"><a href="/shorts/ddddddddddd">short</a></li>
    </ul>
  </div>
</body>
</html>
