# Neat licence Worker — Cloudflare Workers free plan.
# Deploy (owner, once): see store/RECORD-OWNER-STEPS.md
#   npx wrangler login
#   npx wrangler kv namespace create LICENCES      → paste the id below
#   npx wrangler secret put STRIPE_SECRET_KEY      (restricted key: Checkout Sessions = Read)
#   npx wrangler secret put LICENCE_PRIVATE_JWK    (contents of .secrets/licence-private.jwk)
#   npx wrangler secret put BREVO_API_KEY          (optional: emails the key)
#   npx wrangler deploy
name = "neat-licence"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true # kept: the old address 301s to PUBLIC_URL
routes = [{ pattern = "licence.neatextensions.com", custom_domain = true }]

[[kv_namespaces]]
binding = "LICENCES"
id = "7f1d5255b4fc4e19a425f43773ffb0df"

[vars]
PRODUCT = "record"
STRIPE_PRICE_ID = "price_1UU1UTKQkt4VVAqMwa6aOxWu"
MAIL_FROM = "keys@neatextensions.com"
MAIL_FROM_NAME = "Neat Extensions"
SUPPORT_URL = "mailto:hello@neatextensions.com"
PUBLIC_URL = "https://licence.neatextensions.com"
